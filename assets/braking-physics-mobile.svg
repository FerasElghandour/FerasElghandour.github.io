<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 940" role="img" aria-labelledby="title desc"><title id="title">Nine Webots stopping cases</title><desc id="desc">All nine cases start from rest and avoid obstacle contact. Each row reports requested cruise, initial reference gap, minimum reference distance and actual peak speed. Reference distance is not bumper clearance.</desc><rect width="400" height="940" fill="#fcfaf6"/><g font-family="Arial,sans-serif" fill="#332b3b"><text x="20" y="35" font-size="23" font-weight="700">Nine measured stops</text><text x="20" y="64" font-size="16" >All start from rest / no obstacle contact</text><text x="20" y="105" font-size="16" >Request 5 m/s / initial gap 20 m</text><text x="20" y="130" font-size="16" font-weight="700">Min reference 12.79 m</text><text x="378" y="130" font-size="15" text-anchor="end">Peak 4.15 m/s</text><rect x="20" y="141" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="141" width="228.885" height="10" fill="#396981"/><text x="20" y="184" font-size="16" >Request 5 m/s / initial gap 40 m</text><text x="20" y="209" font-size="16" font-weight="700">Min reference 14.40 m</text><text x="378" y="209" font-size="15" text-anchor="end">Peak 5.02 m/s</text><rect x="20" y="220" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="220" width="257.797" height="10" fill="#396981"/><text x="20" y="263" font-size="16" >Request 5 m/s / initial gap 80 m</text><text x="20" y="288" font-size="16" font-weight="700">Min reference 14.40 m</text><text x="378" y="288" font-size="15" text-anchor="end">Peak 5.02 m/s</text><rect x="20" y="299" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="299" width="257.811" height="10" fill="#396981"/><text x="20" y="342" font-size="16" >Request 10 m/s / initial gap 20 m</text><text x="20" y="367" font-size="16" font-weight="700">Min reference 12.79 m</text><text x="378" y="367" font-size="15" text-anchor="end">Peak 4.15 m/s</text><rect x="20" y="378" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="378" width="228.885" height="10" fill="#396981"/><text x="20" y="421" font-size="16" >Request 10 m/s / initial gap 40 m</text><text x="20" y="446" font-size="16" font-weight="700">Min reference 15.83 m</text><text x="378" y="446" font-size="15" text-anchor="end">Peak 7.61 m/s</text><rect x="20" y="457" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="457" width="283.395" height="10" fill="#396981"/><text x="20" y="500" font-size="16" >Request 10 m/s / initial gap 80 m</text><text x="20" y="525" font-size="16" font-weight="700">Min reference 15.38 m</text><text x="378" y="525" font-size="15" text-anchor="end">Peak 10.02 m/s</text><rect x="20" y="536" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="536" width="275.236" height="10" fill="#396981"/><text x="20" y="579" font-size="16" >Request 15 m/s / initial gap 20 m</text><text x="20" y="604" font-size="16" font-weight="700">Min reference 12.79 m</text><text x="378" y="604" font-size="15" text-anchor="end">Peak 4.15 m/s</text><rect x="20" y="615" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="615" width="228.885" height="10" fill="#396981"/><text x="20" y="658" font-size="16" >Request 15 m/s / initial gap 40 m</text><text x="20" y="683" font-size="16" font-weight="700">Min reference 15.83 m</text><text x="378" y="683" font-size="15" text-anchor="end">Peak 7.61 m/s</text><rect x="20" y="694" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="694" width="283.395" height="10" fill="#396981"/><text x="20" y="737" font-size="16" >Request 15 m/s / initial gap 80 m</text><text x="20" y="762" font-size="16" font-weight="700">Min reference 11.05 m</text><text x="378" y="762" font-size="15" text-anchor="end">Peak 12.86 m/s</text><rect x="20" y="773" width="358" height="10" fill="#e9e3e9"/><rect x="20" y="773" width="197.867" height="10" fill="#396981"/><text x="20.0" y="828" font-size="14" text-anchor="start">0 m</text><text x="199.0" y="828" font-size="14" text-anchor="middle">10 m</text><text x="378.0" y="828" font-size="14" text-anchor="end">20 m</text><text x="20" y="861" font-size="14" >Distance: obstacle front to vehicle reference.</text><text x="20" y="885" font-size="14" >One static world, seed 1. Official fixed nightly.</text><text x="20" y="909" font-size="14" >The requested 15 m/s was never reached.</text></g></svg>