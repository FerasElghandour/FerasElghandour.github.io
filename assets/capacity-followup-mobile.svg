<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" role="img" aria-labelledby="title desc"><title id="title">Topology follow-up: all four comparisons</title><desc id="desc">Recorded paired accuracy effects and descriptive intervals, with Holm-adjusted p values. 256 trained models and 32 paired seeds per comparison.</desc><rect width="400" height="570" fill="#fcfaf6"/><g font-family="Arial,sans-serif" fill="#332b3b"><text x="20" y="35" font-size="23" font-weight="700">Topology follow-up</text><text x="20" y="64" font-size="16" >256 models / 32 paired seeds</text><text x="20" y="107" font-size="16" >Optdigits / native</text><text x="376" y="107" font-size="16" text-anchor="end" font-weight="700">+0.541 pp</text><text x="20" y="129" font-size="14" >Holm p = 0.00212</text><line x1="160.67" y1="134" x2="160.67" y2="160" stroke="#b5aeb8" stroke-dasharray="3 3"/><line x1="214.59" y1="147" x2="334.56" y2="147" stroke="#396981" stroke-width="3"/><circle cx="271.72" cy="147" r="5" fill="#396981"/><text x="20" y="199" font-size="16" >Optdigits / order interaction</text><text x="376" y="199" font-size="16" text-anchor="end" font-weight="700">+0.021 pp</text><text x="20" y="221" font-size="14" >Holm p = 1.00000</text><line x1="160.67" y1="226" x2="160.67" y2="252" stroke="#b5aeb8" stroke-dasharray="3 3"/><line x1="74.24" y1="239" x2="254.22" y2="239" stroke="#396981" stroke-width="3"/><circle cx="164.95" cy="239" r="5" fill="#396981"/><text x="20" y="291" font-size="16" >Pendigits / native</text><text x="376" y="291" font-size="16" text-anchor="end" font-weight="700">+0.153 pp</text><text x="20" y="313" font-size="14" >Holm p = 0.89181</text><line x1="160.67" y1="318" x2="160.67" y2="344" stroke="#b5aeb8" stroke-dasharray="3 3"/><line x1="134.99" y1="331" x2="248.90" y2="331" stroke="#396981" stroke-width="3"/><circle cx="192.03" cy="331" r="5" fill="#396981"/><text x="20" y="383" font-size="16" >Pendigits / order interaction</text><text x="376" y="383" font-size="16" text-anchor="end" font-weight="700">-0.004 pp</text><text x="20" y="405" font-size="14" >Holm p = 1.00000</text><line x1="160.67" y1="410" x2="160.67" y2="436" stroke="#b5aeb8" stroke-dasharray="3 3"/><line x1="77.01" y1="423" x2="243.03" y2="423" stroke="#396981" stroke-width="3"/><circle cx="159.75" cy="423" r="5" fill="#396981"/><text x="58.0" y="466" font-size="14" text-anchor="middle">-0.5</text><text x="160.66666666666666" y="466" font-size="14" text-anchor="middle">0</text><text x="263.3333333333333" y="466" font-size="14" text-anchor="middle">0.5</text><text x="366.0" y="466" font-size="14" text-anchor="middle">1</text><text x="20" y="499" font-size="14" >Native: balanced minus random accuracy.</text><text x="20" y="521" font-size="14" >Interaction: difference between feature orders.</text><text x="20" y="543" font-size="14" >Intervals are descriptive and pointwise.</text></g></svg>