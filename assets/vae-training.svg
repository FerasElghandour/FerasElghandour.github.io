<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">Variational autoencoder training path</title><desc id="desc">Thirty scaled features pass through an encoder to a two-dimensional latent distribution, a sampled latent vector and a decoder. Training balances reconstruction and beta-weighted KL loss.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#286887"/></marker></defs><rect width="1000" height="220" fill="#faf8f4"/><g font-family="Helvetica,Arial,sans-serif" fill="#29232d" text-anchor="middle"><g stroke="#286887" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M133 85H207"/><path d="M332 85H407"/><path d="M592 85H667"/><path d="M792 85H866"/></g><g fill="#e7eef0" stroke="#286887"><rect x="14" y="50" width="119" height="70" rx="3"/><rect x="207" y="50" width="125" height="70" rx="3"/><rect x="407" y="35" width="185" height="100" rx="3"/><rect x="667" y="50" width="125" height="70" rx="3"/><rect x="866" y="50" width="120" height="70" rx="3"/></g><g font-size="18"><text x="74" y="80">30 features</text><text x="74" y="104" font-size="13">Train-only scaling</text><text x="270" y="90">Encoder</text><text x="500" y="69">2D latent space</text><text x="500" y="94" font-size="15">μ, log σ² → sample z</text><text x="500" y="117" font-size="13">Reparameterization</text><text x="730" y="90">Decoder</text><text x="926" y="80">Reconstruct</text><text x="926" y="104" font-size="13">30 features</text></g><path d="M270 146V176H926V146" stroke="#b7512d" fill="none" stroke-width="1.5"/><text x="600" y="204" fill="#b7512d" font-size="17">Training objective: reconstruction loss + β × KL divergence</text></g></svg>